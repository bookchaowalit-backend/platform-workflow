# Staged only. The image builds from uv.lock (docs/RUNTIME.md); configure the isolated runtime role before release.
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"
[deploy]
startCommand = "platform-workflow api"
healthcheckPath = "/readyz"
healthcheckTimeout = 20
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1
