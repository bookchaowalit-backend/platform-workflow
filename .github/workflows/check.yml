name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contract and tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Verify vendored schema matches pinned canonical
        run: python3 scripts/check_schema_pin.py

      - name: Check out pinned platform-ops-cli source (BOO-165, public, read-only)
        uses: actions/checkout@v4
        with:
          repository: bookchaowalit/platform-ops-cli
          ref: f372959408a4438eb41ef1a1ad3c8a53454dca0e
          path: .ci-sources/platform-ops-cli
          persist-credentials: false

      - name: Re-extract platform-ops-cli schedules against the BOO-165 snapshot
        run: python3 scripts/scheduler_inventory.py verify-source --source platform-ops-cli --repo .ci-sources/platform-ops-cli

      - name: Run offline contract check and tests
        env:
          PLATFORM_OPS_CLI_ROOT: ${{ github.workspace }}/.ci-sources/platform-ops-cli
          BOO165_REQUIRE_OPS_SOURCE: "1"
        run: bash scripts/check.sh

  # Shared workflow on the locked environment: uv sync --frozen --all-extras (uv.lock, with
  # platform-backend-core pinned to a reviewed Git commit), Ruff, mypy ([tool.mypy]) and the
  # whole pytest suite, including the PostgreSQL runtime tests formerly in shared-runtime.yml,
  # under a coverage gate; then the wheel build.
  python:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/ci-python.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
    with:
      python-version: "3.12"
      postgres: true
      format-check: false # follow-up: adopt ruff format
      # Ratchet: measured 77.89% on 2026-10-24 (ADR-0004: threshold = measured, rounded down).
      # The pinned-source re-extraction tests run only in the contract job, so they are not counted.
      coverage-threshold: "77"
      test-command: |
        PLATFORM_TEST_DSN="$DATABASE_URL" python -m pytest -q --cov --cov-report=
        uv build --wheel --out-dir dist .

  security:
    uses: bookchaowalit/platform-ci-workflows/.github/workflows/security.yml@87dc5e1c7e0416886a6371d5a101bb2ccba38edd # v1.1.1
